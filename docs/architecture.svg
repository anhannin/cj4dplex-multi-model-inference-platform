<rect x="65" y="270" width="435" height="180" rx="8" class="box"/><rect x="600" y="270" width="435" height="180" rx="8" class="box"/>
<text x="280" y="301" text-anchor="middle">Qwen Deployment · replica1</text><text x="280" y="334" text-anchor="middle">/qwen/request → callback → 독립 FIFO</text><text x="280" y="367" text-anchor="middle">단일 Worker → 원본 generate()</text><text x="280" y="399" class="small" text-anchor="middle">결과: /qwen/result/r_UUID</text><text x="280" y="427" class="small" text-anchor="middle">Burst 대기용량16 / 모델 상주</text>
<text x="820" y="301" text-anchor="middle">YOLO Deployment · replica1</text><text x="820" y="334" text-anchor="middle">/yolo/request → callback → 독립 FIFO</text><text x="820" y="367" text-anchor="middle">단일 Worker → 원본 predict()</text><text x="820" y="399" class="small" text-anchor="middle">결과: /yolo/result/r_UUID</text><text x="820" y="427" class="small" text-anchor="middle">Burst 대기용량512 / 모델 상주</text>
