<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">단일 DGX Spark의 두 모델 독립 Queue·Worker와 GPU 공유 구조</title><desc id="desc">최종 정적 MPS 실험 구조. UUID 응답 채널, 두 Kubernetes Pod, 48SM 공유 GPU, 로그·별도 프로파일링과 기본 재시작.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#43515e"/></marker><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#182532;font-size:17px}.h{font-size:23px;font-weight:700}.small{font-size:14px}.box{fill:#fff;stroke:#657484;stroke-width:1.7}.line{fill:none;stroke:#43515e;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1100" height="740" fill="#f7f9fb"/>
