<rect x="200" y="96" width="700" height="70" rx="8" class="box"/>
<text x="550" y="126" text-anchor="middle">요청 클라이언트 / 부하 생성기</text><text x="550" y="150" class="small" text-anchor="middle">Qwen C1 또는 Burst10 · YOLO 일정 요청률 또는 Burst300 · 요청별 UUID</text>
<rect x="35" y="210" width="1030" height="410" rx="12" fill="#edf2f6" stroke="#8e9cab" stroke-width="2"/>
