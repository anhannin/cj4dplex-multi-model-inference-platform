apiVersion: v1
kind: Pod
metadata:
  name: dns-http-smoke
  namespace: cj-validation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: dns-http-smoke
    image: busybox:1.37.0
    command:
    - sh
    - -c
    - |
      set -eu
      nslookup kubernetes.default.svc.cluster.local
      wget -qO /tmp/index.html http://smoke-web
      grep -q 'Welcome to nginx' /tmp/index.html
      echo DNS_HTTP_OK
    resources:
      requests:
        cpu: 50m
        memory: 16Mi
      limits:
        memory: 64Mi
