apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  namespace: cj-validation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  runtimeClassName: nvidia
  containers:
  - name: gpu-check
    image: nvidia/cuda:13.0.0-base-ubuntu24.04
    command: [nvidia-smi]
    args: ["--query-gpu=name,driver_version", "--format=csv,noheader"]
    resources:
      limits:
        nvidia.com/gpu: 1
        memory: 256Mi
      requests:
        cpu: 50m
